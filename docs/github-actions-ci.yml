# Reference copy of the GitHub Actions CI workflow.
#
# This file could not be pushed to `.github/workflows/ci.yml` directly because the
# token used to create the branch lacked the `workflow` OAuth scope. To enable CI,
# copy this file to `.github/workflows/ci.yml` (e.g. via the GitHub web UI, or with a
# token that has the `workflow` scope) on the default branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package (with dev extras)
        run: pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Run tests (offline; deselect slow)
        run: pytest -m 'not slow' -q
