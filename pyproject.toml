[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tcr-cliff"
version = "0.1.0"
description = "Activity-cliff-aware TCR-pMHC binding prediction with protein language model embeddings and structural-confidence fusion."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "tcr-cliff contributors" }]
keywords = [
  "immunology",
  "TCR",
  "pMHC",
  "activity-cliff",
  "ESM-2",
  "protein-language-model",
  "AlphaFold",
  "binding-prediction",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies are deliberately lightweight so the package imports and the
# toy/offline tests run without torch, fair-esm, or LightGBM installed.
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "networkx>=3.1",
  "typer>=0.12",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "biopython>=1.81",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "shap>=0.44",
  "joblib>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Protein language model backends (ESM-2). Either fair-esm or transformers works.
esm = ["fair-esm>=2.0.0", "transformers>=4.38", "torch>=2.1"]
# Gradient-boosted baseline. Falls back to sklearn HistGradientBoosting if absent.
boost = ["lightgbm>=4.1"]
# Deep cliff-aware contrastive model.
torch = ["torch>=2.1"]
# Everything heavy, for full reproduction of the benchmarks.
full = [
  "fair-esm>=2.0.0",
  "transformers>=4.38",
  "torch>=2.1",
  "lightgbm>=4.1",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "black>=24.0",
  "pre-commit>=3.6",
  "nbformat>=5.9",
  "nbconvert>=7.0",
  "jupyter>=1.0",
  "ipykernel>=6.0",
]

[project.urls]
Homepage = "https://github.com/tcr-cliff/tcr-cliff"
Documentation = "https://github.com/tcr-cliff/tcr-cliff#readme"
Issues = "https://github.com/tcr-cliff/tcr-cliff/issues"

[project.scripts]
tcr-cliff = "tcr_cliff.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tcr_cliff"]

[tool.hatch.build.targets.sdist]
include = ["src/tcr_cliff", "tests", "configs", "DATASETS.md", "README.md", "LICENSE"]

# Bundle the toy dataset (CSV + precomputed structure-confidence JSONs) inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/tcr_cliff/data/toy" = "tcr_cliff/data/toy"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # line length is handled by black
  "B905",   # zip strict= not always desired
]

[tool.ruff.lint.flake8-bugbear]
# Typer's idiomatic API requires Option/Argument calls in parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: tests that load heavy models or hit the network (deselect with -m 'not slow')",
  "torch: tests that require torch",
  "esm: tests that require an ESM-2 backend",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["tcr_cliff"]
branch = true
